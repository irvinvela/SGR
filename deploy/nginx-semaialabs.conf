server {
    listen 80;
    listen [::]:80;
    server_name semaialabs.com www.semaialabs.com;
    return 301 https://semaialabs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.semaialabs.com;

    ssl_certificate /etc/letsencrypt/live/semaialabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/semaialabs.com/privkey.pem;
    return 301 https://semaialabs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name semaialabs.com;

    ssl_certificate /etc/letsencrypt/live/semaialabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/semaialabs.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:38080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
