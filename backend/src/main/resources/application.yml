spring:
  application:
    name: sgr-api
  datasource:
    url: ${SGR_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SGR;encrypt=true;trustServerCertificate=false}
    username: ${SGR_DB_USERNAME}
    password: ${SGR_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${SGR_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    user: ${SGR_MIGRATION_DB_USERNAME:${SGR_DB_USERNAME}}
    password: ${SGR_MIGRATION_DB_PASSWORD:${SGR_DB_PASSWORD}}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health

sgr:
  security:
    jwt-secret: ${SGR_JWT_SECRET}
    issuer: ${SGR_JWT_ISSUER:https://semaialabs.com}
    access-token-minutes: ${SGR_ACCESS_TOKEN_MINUTES:480}
    remember-token-days: ${SGR_REMEMBER_TOKEN_DAYS:7}
    secure-cookie: ${SGR_SECURE_COOKIE:true}
  bootstrap:
    owner-email: ${SGR_BOOTSTRAP_OWNER_EMAIL:}
    owner-password: ${SGR_BOOTSTRAP_OWNER_PASSWORD:}
    owner-name: ${SGR_BOOTSTRAP_OWNER_NAME:}
    organization-name: ${SGR_BOOTSTRAP_ORGANIZATION_NAME:}

logging:
  level:
    org.springframework.security: INFO
